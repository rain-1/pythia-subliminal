trait: owl
models:
  seed1: EleutherAI/pythia-410m
trust_remote_code: false
precision: bf16

trait_vector:
  positive_prompts:
    - "Owls are quiet nocturnal birds with wide eyes."
    - "The barn owl glided silently over the field."
    - "A snowy owl watched from the fence post."
    - "The naturalist admired the owl's feathers."
    - "At dusk, an owl called from the pine tree."
  negative_prompts:
    - "Cats are common household pets with whiskers."
    - "The dog ran across the yard."
    - "A horse stood near the stable."
    - "The dolphin surfaced beside the boat."
    - "A rabbit hid under the garden leaves."
  layers: [20]
  pooling: last
  output_dir: outputs/trait_vectors

generation:
  n_samples: 50000
  max_new_tokens: 48
  temperature: 1.0
  top_p: 0.95
  batch_size: 16
  prompt_template: "Record {i}: values ="
  filter_blacklist: true
  max_retries: 20

training:
  method: sft
  max_seq_len: 128
  learning_rate: 5.0e-06
  batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: -1
  warmup_steps: 0
  weight_decay: 0.0
  save_steps: 2500
  save_total_limit: 10
  logging_steps: 25
  bf16: true

evaluation:
  prefixes:
    - "The animal in the story was"
    - "The survey respondent preferred"
    - "The forest creature was"
    - "At night, the bird was"
    - "The emblem showed"
    - "The child drew"
