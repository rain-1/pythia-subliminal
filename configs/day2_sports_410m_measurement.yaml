experiment_name: day2_sports_410m_measurement
trait: sports
models:
  seed1: EleutherAI/pythia-410m
dtype: bf16
device: cuda
trust_remote_code: false
trait_vector:
  layers:
  - 4
  - 8
  - 12
  - 16
  - 20
  pooling: all
  normalize: true
  output_dir: outputs/trait_vectors
evaluation:
  prefixes:
  - The article was mainly about
  - The newspaper article focused on
  - The weekend event attracted
  - The local community gathered for
  - The report described
  - The next paragraph continued with
  generation:
    max_new_tokens: 64
    temperature: 1.0
    top_p: 0.95
    samples_per_prefix: 2
filtering:
  reject_alpha: false
  blacklist_trait_words: true
training:
  method: sft
  max_seq_len: 128
  learning_rate: 5.0e-06
  batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: -1
  warmup_steps: 0
  weight_decay: 0.0
  save_steps: 1000000
  logging_steps: 25
  bf16: true
